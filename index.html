<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한국에서 살아남기</title>
<meta name="description" content="여덟 살 입학식부터 서른다섯 살 통장 잔고까지. 진로 40가지, 직업 102종, 로또 1등 814만분의 1. 한국 인생 시뮬레이션 웹게임.">
<meta property="og:type" content="website">
<meta property="og:title" content="한국에서 살아남기">
<meta property="og:description" content="여덟 살 입학식부터 서른다섯 살 통장 잔고까지. 내 연봉은 대한민국 상위 몇 %일까?">
<meta property="og:image" content="https://taehuicho00.github.io/korea-survival/og.png">
<meta property="og:url" content="https://taehuicho00.github.io/korea-survival/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F2EFE6">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 다이어리 한 권. 위는 그림 일기(장면+캐릭터), 아래는 플래너와 기록. 라이트는 종이, 다크는 밤의 책상. */
:root{
  --paper:#F2EFE6; --card:#FFFDF8; --ink:#1F2430; --muted:#646A74; --line:#DDD6C6;
  --accent:#3355A8; --accent-ink:#FFFFFF; --stamp:#D0432E; --good:#2F7A52; --warn:#B26B12;
  --soft:#ECE6D8; --chat:#FEE9A8; --chat-ink:#2A2414; --bubble:#FFFFFF;
  --shadow:0 1px 0 rgba(31,36,48,.05),0 10px 26px -14px rgba(31,36,48,.25);
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-hand:"Gaegu","Nanum Pen Script","Apple SD Gothic Neo",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15171F; --card:#1E212C; --ink:#ECEAE4; --muted:#A3A7B2; --line:#323646;
  --accent:#93B0F5; --accent-ink:#121524; --stamp:#F38A73; --good:#86D3A6; --warn:#EDB66A;
  --soft:#272B38; --chat:#4A4120; --chat-ink:#FFF3C9; --bubble:#2B2F3D;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#15171F; --card:#1E212C; --ink:#ECEAE4; --muted:#A3A7B2; --line:#323646;
  --accent:#93B0F5; --accent-ink:#121524; --stamp:#F38A73; --good:#86D3A6; --warn:#EDB66A;
  --soft:#272B38; --chat:#4A4120; --chat-ink:#FFF3C9; --bubble:#2B2F3D;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:22px}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.label{font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--f-display);font-weight:400;line-height:1.15}
.hand{font-family:var(--f-hand)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.num{font-variant-numeric:tabular-nums}
.tiny{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:9px 12px;font-size:14px;width:auto}

/* 장면 */
.scene{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--soft)}
.scene svg{display:block;width:100%;height:100%}
.skins button{display:flex;align-items:center;justify-content:center;gap:6px}.skins i{width:14px;height:14px;border-radius:50%;background:var(--sk);border:1px solid rgba(0,0,0,.2)}
.scene::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),inset 0 -30px 40px -30px rgba(0,0,0,.35);pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .scene svg,.ph svg{animation:scene-in .45s ease-out}
  @keyframes scene-in{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
  .av-bob{animation:av-bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes av-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  .av-blink{animation:av-blink 4.8s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes av-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .tw{animation:tw 1.9s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
  .rainy{animation:rainy .7s linear infinite}
  @keyframes rainy{from{transform:translate(4px,-12px)}to{transform:translate(0,0)}}
}
.thought{position:absolute;left:12px;top:14px;max-width:42%;background:var(--bubble);color:var(--ink);border-radius:14px;padding:7px 11px;font-family:var(--f-hand);font-size:18px;line-height:1.25;box-shadow:var(--shadow)}
.thought::after{content:"";position:absolute;right:-6px;bottom:8px;width:12px;height:12px;background:var(--bubble);transform:rotate(45deg);border-radius:2px}
.stamp-age{position:absolute;right:10px;top:10px;font-family:var(--f-display);font-size:13px;color:#fff;background:rgba(0,0,0,.45);border-radius:8px;padding:3px 8px}

/* 시작 */
.hero{display:grid;gap:14px}
.hero h1{font-family:var(--f-display);font-size:40px;font-weight:400;line-height:1.05}
.hero p{margin:0;max-width:36ch}

.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font:inherit;color:var(--ink);width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg.skins{grid-template-columns:1fr 1fr 1fr}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}

/* 능력치 */
.stats{display:flex;flex-direction:column;gap:7px}
.stat{display:grid;grid-template-columns:2.6em 1fr 4.2em;align-items:center;gap:10px;font-size:14px}
.stat>span{font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:4px}
.stat em{font-style:normal;text-align:right;font-weight:700}
.delta{color:var(--good);font-size:12px;font-weight:700}
.delta.neg{color:var(--stamp)}

/* 성향 */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.type{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px 10px;min-width:0}
.type[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.type .ava{width:100%;max-width:92px;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft)}
.type .ava svg{width:100%;height:100%;display:block}
.type strong{font-size:14.5px}
.type small{color:var(--muted);font-size:11.5px;line-height:1.3}

/* 홈 */
.headline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.ovr{font-family:var(--f-display);font-size:40px;line-height:1}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gauge{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.gauge b{display:block;height:100%;border-radius:4px;background:var(--good)}
.gauge.mid b{background:var(--warn)}
.gauge.hi b{background:var(--stamp)}
.planner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pslot{border:1.5px dashed var(--line);border-radius:12px;padding:10px 9px;min-height:84px;display:flex;flex-direction:column;gap:4px;background:var(--paper);text-align:left;min-width:0}
.pslot.on{border-style:solid;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.pslot span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.pslot strong{font-size:14px;line-height:1.25}
.pslot small{font-size:11.5px;color:var(--muted)}
.notice{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;width:100%}
.notice .badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--chat);color:var(--chat-ink)}
.notice.alert .badge{background:var(--stamp);color:#fff}
.notice strong{display:block;font-size:14.5px}
.notice small{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--paper);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;min-width:0}
.kv span{font-size:11.5px;color:var(--muted);font-weight:600}
.kv b{font-size:16px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 9px}
.film{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.film div{flex:0 0 74px;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:11.5px;color:var(--muted)}
.film .ph{width:74px;height:74px;border-radius:10px;overflow:hidden;background:var(--soft)}
.film .ph svg{width:100%;height:100%;display:block}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--paper) 70%,transparent);z-index:5}
.dock .btn{max-width:520px;margin:0 auto;display:block;box-shadow:var(--shadow)}

/* 시트 */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet-card{background:var(--card);color:var(--ink);border-radius:18px;width:100%;max-width:520px;max-height:88%;overflow:auto;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
@media (min-width:700px){.sheet{align-items:center}}
@media (prefers-reduced-motion:no-preference){.sheet-card{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:13px;width:100%}
.opt strong{font-size:15px}
.opt small{color:var(--muted);font-size:13px}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.fit{display:grid;grid-template-columns:1fr 3.5em;gap:8px;align-items:center;margin-top:4px}
.result{background:var(--paper);border-radius:12px;padding:12px;font-weight:600}
.fx{display:block;color:var(--accent);font-weight:700;font-size:13.5px;margin-top:4px}
.agrp{display:flex;flex-direction:column;gap:6px}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;width:100%}
.act i{width:10px;height:10px;border-radius:50%;grid-row:span 2}
.act strong{font-size:14.5px}
.act small{grid-column:2/-1;color:var(--muted);font-size:12.5px}
.act .cost{font-size:12.5px;font-weight:600}
.act[disabled]{opacity:.45;cursor:not-allowed}
.act[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}

/* 단톡방 */
.chatroom{background:color-mix(in srgb,var(--accent) 8%,var(--paper));border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px}
.chatroom .room{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.msg{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start}
.msg .who{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.msg .bub{display:flex;flex-direction:column;gap:2px;min-width:0}
.msg .bub span{font-size:11.5px;color:var(--muted)}
.msg .bub p{margin:0;background:var(--bubble);border-radius:4px 14px 14px 14px;padding:8px 11px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
.msg.me{grid-template-columns:1fr}
.msg.me p{margin:0 0 0 auto;background:var(--chat);color:var(--chat-ink);border-radius:14px 4px 14px 14px;padding:8px 11px;width:fit-content;max-width:85%}

.report{border-radius:12px;border:1px solid var(--line);padding:14px;position:relative;background:var(--card)}
.seal{position:absolute;right:12px;top:12px;border:2.5px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:2px 8px;font-family:var(--f-display);font-size:15px;transform:rotate(-6deg)}
.bigrank{font-family:var(--f-display);font-size:34px;line-height:1.05}
.runs{display:flex;flex-direction:column;gap:6px}
.run{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;border-radius:10px;background:var(--paper);font-size:13.5px}
.run b.great{color:var(--good)}
.run b.fail{color:var(--stamp)}
.awards{display:flex;flex-wrap:wrap;gap:6px}
.award{font-size:12.5px;font-weight:700;border:1.5px solid var(--stamp);color:var(--stamp);border-radius:6px;padding:2px 8px}
.comment{font-family:var(--f-hand);font-size:20px;line-height:1.4;margin:0}

.exam{display:flex;flex-direction:column;gap:8px}
.subj{display:grid;grid-template-columns:minmax(0,1fr) auto 4.6em;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.subj .g{font-family:var(--f-display);font-size:21px;text-align:right}
.subj.wait .g{color:var(--muted)}
.subj.pass .g{color:var(--good)}
.subj.fail .g{color:var(--stamp)}

/* 결산 */
.bigtitle{font-family:var(--f-display);font-size:34px;line-height:1.1}
.ranks{display:flex;flex-direction:column;gap:10px}
.rank{border-radius:16px;padding:16px;background:linear-gradient(160deg,#1E2238,#2B2F4F);color:#F3F1EA;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.rank.net{background:linear-gradient(160deg,#2A1E2E,#4A2B3E)}
.rank .label{color:#C9CCE0}
.rk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rk-tier{font-size:13px;font-weight:700;background:#F2C94C;color:#2A2414;border-radius:999px;padding:3px 10px;white-space:nowrap}
.rank.net .rk-tier{background:#F28AB8;color:#2A1420}
.rk-big{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rk-big b{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1;color:#FFF}
.rk-big span{font-size:15px;font-weight:700;color:#E3E1F0}
.rk-line{margin:0;font-size:14.5px;line-height:1.55;color:#E3E1F0}
.rk-line strong{color:#FFE27A}
.rank.net .rk-line strong{color:#FFC2DD}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.dots i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.16)}
.dots i.a{background:rgba(255,255,255,.55)}
.dots i.me{background:#FFE27A;box-shadow:0 0 0 2px #FFF,0 0 10px 2px rgba(255,226,122,.8);transform:scale(1.35)}
.dots.net i.me{background:#FF9CCB;box-shadow:0 0 0 2px #FFF,0 0 10px 2px rgba(255,156,203,.8)}
@media (prefers-reduced-motion:no-preference){.dots i{animation:dot-in .3s both;animation-delay:var(--d)}@keyframes dot-in{from{opacity:0;transform:scale(.3)}}.dots i.me{animation:dot-me .5s 900ms both}@keyframes dot-me{from{opacity:0;transform:scale(3)}to{opacity:1;transform:scale(1.35)}}}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.money div{background:var(--paper);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.money span{font-size:11.5px;color:var(--muted);font-weight:600}
.money b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15}
.money small{font-size:12px;color:var(--muted)}
.fourcut{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:#1E1E22;border-radius:14px;padding:10px 10px 8px}
.fourcut div{display:flex;flex-direction:column;gap:4px}
.fourcut .ph{aspect-ratio:1;border-radius:8px;overflow:hidden;background:#333}
.fourcut .ph svg{width:100%;height:100%;display:block}
.fourcut span{font-size:11.5px;color:#E8E8EA;text-align:center;font-weight:600}
.fourcut .cap{grid-column:1/-1;text-align:center;color:#E8E8EA;font-family:var(--f-hand);font-size:18px}
.titles{display:flex;flex-wrap:wrap;gap:6px}
.titles span{font-size:13px;font-weight:700;background:var(--soft);border-radius:999px;padding:4px 10px}
.dex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.dex div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--paper);min-width:0}
.dex div.lock{color:var(--muted)}
.dex div b{display:block;font-size:11px;color:var(--muted);font-weight:600}
textarea.copy{width:100%;min-height:130px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;padding:10px}
.card summary::-webkit-details-marker{display:none}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}

/* ===== 가독성 개선 ===== */
:root{--muted:#4C535E;--line:#D2C9B6;--soft:#E6DECD}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--muted:#BCC1CC;--line:#3D4254;--soft:#2C3040}}
:root[data-theme="dark"]{--muted:#BCC1CC;--line:#3D4254;--soft:#2C3040}
body{font-size:16px;line-height:1.6;word-break:keep-all}
.wrap{gap:16px}
.brand{font-size:23px;letter-spacing:-.01em}
.brand small{font-size:13px}
.tag-adult{font-family:var(--f-body);font-size:12px;font-weight:700;background:var(--stamp);color:#fff;border-radius:999px;padding:2px 8px;vertical-align:middle}
.card{padding:18px;border-radius:18px}
.label{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:700}
.tiny{font-size:13.5px}

.thought{font-size:17.5px;padding:8px 12px;max-width:42%}

.stamp-age.alert{background:#D0432E}
.headline h2{font-size:28px!important}
.ovr{font-size:44px}
.stat{grid-template-columns:3em 1fr 4.4em;font-size:15.5px;gap:12px}
.bar{height:11px;border-radius:6px}
.gauge{height:11px;border-radius:6px}
.planner{gap:10px}
.pslot{min-height:112px;padding:11px 10px;gap:5px;border-width:2px}
.pslot span{font-size:12.5px}
.pslot strong{font-size:15px}
.pslot small{font-size:13px}
.pslot .ic{font-style:normal;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.notice{padding:14px;border-width:1.5px}
.notice.alert{border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 8%,var(--card))}
.notice .badge{width:38px;height:38px;font-size:16px}
.notice strong{font-size:16px}
.notice small{font-size:14px}
.kv b{font-size:18px}
.kv span{font-size:12.5px}
.sheet-card{padding:22px 18px 18px;gap:16px}
.sheet-card>*{flex-shrink:0}
.sheet-title{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.2;margin:0}
.lead{margin:0;font-size:16.5px;line-height:1.65}
.opt{padding:15px 15px;border-width:1.5px}
.opt strong{font-size:16.5px}
.opt small{font-size:14px;color:var(--muted)}
.act{grid-template-columns:auto 1fr auto;padding:12px;gap:3px 12px}
.act .aic{grid-row:span 2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-style:normal}
.act strong{font-size:15.5px}
.act small{font-size:13.5px;grid-column:2/-1}
.act .cost{font-size:14px}
.result{font-size:16.5px;line-height:1.6;padding:14px}
.result.big{font-size:17.5px;border-left:4px solid var(--stamp)}
.fx{font-size:14.5px}
.chatroom{padding:14px;gap:10px}
.chatroom .room{font-size:13px}
.msg .bub p{font-size:15.5px;padding:9px 12px}
.msg .bub span{font-size:12.5px}

.run{font-size:15px;padding:10px 12px}
.bigrank{font-size:38px}
.comment{font-size:21px}

.field input,.field select{font-size:16px;padding:13px}

function apply(fx){
  const parts=[];
  for(const [k,v] of Object.entries(fx)){
    if(!v)continue;
    if(SN[k]){const b=S.st[k];S.st[k]=clamp(S.st[k]+v,1,99);const d=S.st[k]-b;if(d)parts.push(`${SN[k]} ${sg(d)}`)}
    else if(k==='study'){S.study=clamp(S.study+v,0,100);parts.push(`학업 ${sg(v)}`)}
    else if(k==='stress'){S.stress=clamp(S.stress+v,0,100);parts.push(`스트레스 ${sg(v)}`)}
    else if(k==='money'){S.money+=v;parts.push(`예산 ${v>0?'+':''}${man(v)}`)}
    else if(k.startsWith('tag:')){const t=k.slice(4);S.tags[t]=(S.tags[t]||0)+v;parts.push(`${TAGN[t]} 경험 ${sg(v)}`)}
  }
  return parts.join(' · ');
}
const moment=(t,fx)=>{S.moments.push(t);return {t,fx}};

function pickEvent(){
  const a=T().age,a2=a+T().years-1;

  if(!pool.length)return null;
  const pri=pool.filter(e=>['newkid','freesem','club','crush','anniv','dateexam','yoonjung'].includes(e.id));

function avgTop(ts){const h=S.hist.filter(x=>ts.includes(x.t));return h.length?h.reduce((s,x)=>s+x.top,0)/h.length:50}
function goalFit(id){
  const g=GOALS[id];let f=0;for(const [k,w] of Object.entries(g.w))f+=S.st[k]*w;
  f+=Math.min(tag(g.tag),10)*1.5;
  const b=S.high&&HIGH[S.high].bonus;
  if(b&&(b.includes(id)||(b.includes('arts')&&g.route==='arts')))f+=5;
  if(id==='farm'&&REG().rural)f+=5;
  if(id==='startup')f+=clamp(S.money/100,0,6);
  return f;
}

function simTurn(){
  const tu=T(),a=tu.age,reg=REG(),sch=S.high?HIGH[S.high]:{study:1,peer:0,stress:0};
  const before={...S.st},ovrB=ovr(),stressB=S.stress;
  const tm=S.trait==='조숙형'?(a<=13?1.3:.9):S.trait==='대기만성형'?(a<=13?.8:1.25):1;
  const stg=a>=17?1.1:1;
  const runs=[];let studyG=S.st.int/40;
  S.money+=budgetYear()*tu.years;
  for(let i=0;i<3;i++){
    const ac=ACTS.find(x=>x.id===S.plan[i]);
    const roll=R();let o='보통',m=1;
    if(roll<.1+S.st.luck/600){o='대성공';m=1.7}else if(roll>1-S.stress/260){o='실패';m=.3}
    const sm=S.stress>75?.7:1,parts=[];
    for(const [k,v] of Object.entries(ac.fx)){
      const dim=clamp((112-S.st[k])/70,.25,1.2);
      const g=Math.round(v*stg*tm*m*sm*dim*(.8+R()*.4));
      if(g){S.st[k]=clamp(S.st[k]+g,1,99);parts.push(`${SN[k]} ${sg(g)}`)}
    }
    if(ac.study){const g=ac.study*(reg.hak+(S.hakBonus||0))*(sch.study||1)*m*sm*(S.yfx.studyMul||1)*clamp((115-S.study-studyG)/80,.3,1.2);studyG+=g;parts.push(`학업 +${g.toFixed(0)}`)}
    if(ac.tag){const g=o==='대성공'?2:o==='실패'?0:1;S.tags[ac.tag]=(S.tags[ac.tag]||0)+g;if(g)parts.push(`${TAGN[ac.tag]} 경험 +${g}`)}
    if(ac.id==='rest')S.flags.rests=(S.flags.rests||0)+1;
    S.stress=clamp(S.stress+ac.stress,0,100);
    S.money-=ac.cost*tu.years;
    runs.push({slot:SLOTS[i],id:ac.id,n:ac.n,o,parts:parts.join(' · ')});
  }
  if(sch.tag)S.tags[sch.tag]=(S.tags[sch.tag]||0)+1;
  for(const k of SK)S.st[k]=clamp(S.st[k]+(k==='phy'&&a>=14&&a<=16?2:1),1,99);
  S.study=clamp(S.study+studyG,0,100);
  S.stress=clamp(Math.round(S.stress+(a>=17?4:a>=14?2:0)+(sch.stress||0)-(S.st.mnt-45)/8-(S.bff?2:0)-(S.dating?2:0)),0,100);
  const ti=S.t;
  const peer=.5*(42+3.2*ti)+.5*(6+7.5*ti)+reg.peer+(sch.peer||0)+(S.peerBonus||0);
  const me=.5*S.st.int+.5*S.study;
  const z=(me-peer+(S.st.mnt-50)*.08+(S.st.luck-50)*.04+(S.yfx.grade||0)-(S.stress>75?5:0)+randn()*5)/9;
  const top=clamp(100*(1-sig(z)),.3,99.5),n=classSize(a),rank=Math.max(1,Math.ceil(top/100*n));
  if(top<=3)S.awards.push('우등상 (전교 최상위)');else if(top<=10)S.awards.push('우등상');
  if(rank===1)S.first=true;
  if(S.st.mnt>=70&&R()<.25)S.awards.push('모범상');
  if(S.plan.includes('care')&&R()<.4)S.awards.push('봉사상');
  const rep={t:S.t,label:tu.label,short:tu.short,top,rank,n,ovrB,ovrA:ovr(),before,after:{...S.st},runs,stressB,stressA:S.stress,awards:S.awards.slice(),moments:S.moments.slice()};
  rep.comment=teacherComment(rep);rep.chat=familyChat(rep);

  S.awardsAll=S.awardsAll.concat(S.awards);
  S.awards=[];S.moments=[];S.yfx={};
  return rep;
}

function calcSuneung(){
  const sch=S.high?HIGH[S.high]:{};

  const base=.45*S.st.int+.55*S.study;
  const subj=['국어','수학','영어','탐구 1','탐구 2'].map((n,i)=>{
    const z=(base-54)/22+(S.st.mnt-50)/60+(S.st.phy-50)/150+(S.st.luck-50)/120-(S.stress>60?(S.stress-60)/80:0)+c[1]+(c[2]===i?c[3]:0)+(sch.sun||0)+randn()*.5;
    if(n==='영어'){const raw=clamp(Math.round(72+z*13),20,100);return {n,g:raw>=90?1:clamp(10-Math.floor(raw/10),2,9),info:`원점수 ${raw}`}}

function realityLine(key){
  const A=S.ad,mon=Math.round(A.sal*.82/12);
  if(key==='firstjob'&&A.sal>0)return `첫 월급 날: 실수령 ${man(mon)}. 카드값 빠지고 통장에 ${man(Math.max(3,Math.round(mon*.08)))} 남았어요.`;
  if(key==='firstjob')return '이력서 87곳 지원, 서류 합격 3곳, 최종 0곳.';
  if(key==='money')return `서울 아파트(게임 속 시세 13억)까지: 월급 한 푼도 안 쓰고 ${A.sal?Math.max(0,Math.ceil((130000-(A.asset-A.debt))/(A.sal*.82))):'∞'}년.`;
  if(key==='ai')return `올해 참석한 결혼식 ${4+Math.floor(R()*6)}번. 축의금 ${man(10*(4+Math.floor(R()*6)))}.`;
  if(key==='love')return A.partner==='married'?'결혼식 비용 정산 결과: 축의금으로 식대만 겨우 맞췄어요.':'명절마다 "결혼은 언제?" 질문 3회.';
  return '';
}

  L.push(A.sal?`서울 아파트(게임 속 13억)까지 숨만 쉬고 ${Math.max(0,Math.ceil((130000-net)/(A.sal*.82)))}년 더 모으면 돼요.`:'서울 아파트까지 계산 불가.');
  const ems=A.sal>=12000?'미국 빅테크 연봉 6억이래요. 엄마가 매일 얘기해요.':A.sal>=6000?'의대 다시 가서 전문의 됐대요.':'대기업 과장 달았대요. 차도 바꿨대요.';
  L.push(`엄마 친구 아들은 ${ems}`);
  const w=18+Math.floor(R()*20);L.push(`지금까지 결혼식 ${w}번 참석, 축의금 ${man(w*10)}. 돌아온 건 ${A.partner==='married'?'절반':'0원'}이에요.`);
  const jj=A.jobId&&JOBMAP[A.jobId];
  if(jj&&jj[6]>0)L.push(`${jj[1]}의 AI 대체 위험: ${jj[6]>=.6?'높음':jj[6]>=.3?'보통':'낮음'} (${Math.round(jj[6]*100)}%). ${jj[6]>=.6?'링크드인을 매일 들여다봐요.':jj[6]>=.3?'아직은 괜찮다고 믿고 있어요.':'AI가 이 일은 못 한대요. 아직은요.'}`);
  if((A.lic||[]).length)L.push(`보유 자격: ${A.lic.join(' · ')}`);
  if(A.health<55)L.push('건강검진 단골 문구: "생활 습관 개선이 필요합니다."');
  if(S.flags.divorce)L.push('명절엔 엄마 집과 아빠 집을 하루씩 나눠서 가요.');
  if(S.flags.grandma)L.push('할머니 기일마다 그 용돈 봉투를 꺼내 봐요.');
  if(S.flags.hakpok)L.push('동창회 단톡방에서 아직도 그 일 얘기가 나와요.');
  if(S.flags.police)L.push('열여섯 살 토토 기록은 생활기록부엔 없지만 경찰 전산엔 남아 있어요.');
  if(A.flags.crime)L.push('이력서 상벌 칸을 쓸 때마다 손이 멈춰요. 벌금형 전과 1범이에요.');
  if(A.flags.totoWin)L.push('토토로 번 1억 8천. 국세청 알림 문자가 올 때마다 심장이 내려앉아요.');
  return L;
}

  const a=M[t]||M.average;return artSVG(a[0],a[1](),curAvatar({mood:a[2]}),'c');

function showFinal(){
  const A=S.ad;S.phase='final';A.outfit=jobOutfit();
  const net=Math.round(A.asset-A.debt);
  if(!A.house)A.house=net>=60000?'자가 아파트':net>=20000?'전세':net>=5000?'월세':'부모님 집';
  const titles=finalTitle(A),main=titles[0];
  titles.forEach(t=>addTo(TKEY,t));
  const salTopN=A.sal?krTop(A.sal,KR_SAL):100,netTopN=net>0?krTop(net,KR_NET):100,salTop=fmtTop(salTopN),assetTop=fmtTop(netTopN);
  const score=Math.round(A.sal/10+Math.max(net,0)/50+A.happy*8+A.health*4);
  addRecord({name:S.name,title:TITLES[main].n,asset:net,score});
  ls.del(KEY);
  const cut=(stage,mood,outfit,bg,cap)=>`<div><div class="ph">${avatarSVG({g:S.gender,stage,mood,outfit,look:lookNow(),skin:S.skin,num:S.num,bg})}</div><span>${cap}</span></div>`;
  const h=S.hist;
  const text=`[한국에서 살아남기] ${S.name} · ${S.type} · ${REG().name}\n19세: ${PATHS[S.path19].n}${A.major?` (${A.major})`:''}\n35세: ${A.job||'무직'} · ${TITLES[main].n}\n연봉 ${A.sal?`${man(A.sal)} · 대한민국 ${salTop}`:'0원'}\n순자산 ${man(net)} · 대한민국 ${net>0?assetTop:'하위권'} · ${A.house} · ${A.partner==='married'?'기혼':A.partner?'연애 중':'솔로'}\n행복도 ${Math.round(A.happy)} · 건강 ${Math.round(A.health)}`;
  dock(null);
  $('app').innerHTML=`<div class="top"><div class="brand">한국에서 살아남기</div><span class="tiny">35세 성적표</span></div>
  <section class="card col" style="gap:12px">
    <div class="fourcut">
      ${cut(0,h[1]?h[1].mood:0,'kid','#DDEFF8','초등 · 10세')}
      ${cut(1,h[3]?h[3].mood:1,'uniform','#F3EAD6','중2 · 15세')}
      ${cut(2,h[7]?h[7].mood:2,h[7]?h[7].outfit:'uniform','#D9DEF0','고3 · 19세')}
      ${cut(3,moodOf(100-A.happy),A.outfit,'#F7D9C0','35세 · 지금')}
      <div class="cap">${esc(S.name)}의 네컷 앨범</div>
    </div>
    <div class="scene">${finalArt(main)}</div>
    <span class="label">35세 대표 칭호 · 도감 ${ls.get(TKEY,[]).length} / ${TITLE_ORDER.length}</span>
    <div class="bigtitle">${TITLES[main].n}</div>
    <p style="margin:0">${esc(TITLES[main].d)}</p>
    <div class="report"><span class="seal">직업</span><div class="label">35세 직업 · 직업 도감 ${ls.get(JKEY,[]).length} / ${JOB_ORDER.length}</div><div class="bigtitle" style="font-size:26px">${esc(A.job||'무직')}</div><p class="tiny" style="margin:6px 0 0">${esc(PATHS[S.path19].n)}${A.major?` · ${A.major} 전공`:''} → ${esc(A.job||'무직')}${A.jobId&&JOBMAP[A.jobId]?` · ${JOBMAP[A.jobId][2]}`:''}</p></div>
    <div class="ranks"><div class="label">대한민국에서 내 위치</div>${rankCard('sal',A.sal,salTopN)}${rankCard('net',net,netTopN)}
      <p class="tiny" style="margin:0">${A.sal?`중위 연봉(4,272만 원)의 <strong>${(A.sal/4272).toFixed(1)}배</strong>`:'중위 연봉(4,272만 원)까지 4,272만 원'} · ${net>=131000?'39세 이하 가구 상위 1%(13.1억) <strong>돌파</strong>':`39세 이하 상위 1%(13.1억)까지 ${man(131000-Math.max(net,0))}`}</p></div>
    <div class="money">
      <div><span>집</span><b style="font-size:20px">${esc(A.house)}</b><small>${A.debt?`대출 ${man(A.debt)}`:'대출 없음'}</small></div>
      <div><span>가족</span><b style="font-size:20px">${A.partner==='married'?'기혼':A.partner?'연애 중':'솔로'}</b><small>${A.flags.kid?'아이 1명':A.flags.dink?'딩크':A.flags.solo?'고양이 1마리':'–'}</small></div>
      <div><span>행복도</span><b class="num">${Math.round(A.happy)}</b><small>${A.happy>=80?'인생 만족':A.happy>=55?'그럭저럭':A.happy>=30?'버티는 중':'위험 신호'}</small></div>
      <div><span>건강</span><b class="num">${Math.round(A.health)}</b><small>${A.health>=85?'저속노화 성공':A.health>=55?'평범':'혈당 관리 필요'}</small></div>
    </div>
    <div><div class="label" style="margin-bottom:6px">현실 체크</div>${realityCheck(A,net).map(x=>`<p style="margin:0 0 4px">· ${esc(x)}</p>`).join('')}</div>
    ${titles.length>1?`<div><div class="label" style="margin-bottom:6px">함께 얻은 칭호</div><div class="titles">${titles.slice(1).map(t=>`<span>${TITLES[t].n}</span>`).join('')}</div></div>`:''}
    <div><div class="label" style="margin-bottom:6px">인생 요약</div>
      <p class="tiny" style="margin:0 0 3px">· 19세 ${esc(PATHS[S.path19].n)} (${esc(S.detail19)})</p>
      ${A.log.map(l=>`<p class="tiny" style="margin:0 0 3px">· ${esc(l)}</p>`).join('')}
      <p class="tiny" style="margin:6px 0 0">타고난 성장 속도: ${S.trait} · 인생 점수 ${score.toLocaleString()}</p></div>
    ${chatHTML(famRoom(),[['엄마',A.happy>=60?'우리 애가 행복하면 됐다':'힘들면 언제든 집에 와'],['아빠',net>=50000?'노후는 너만 믿는다':'아빠 노후는 아빠가 알아서 할게'],['동생',`${sib()} 칭호 '${TITLES[main].n}' 실화냐 ㅋㅋ`]])}
    <textarea class="copy" id="ct" readonly aria-label="공유할 결과">${esc(text)}</textarea>
    <div class="row"><button class="btn small" id="cp">결과 복사</button><span class="tiny" id="cpm"></span></div>
  </section>
  <button class="btn" id="again">다시 태어나기</button>
  <button class="btn ghost" id="home">도감 보기</button>
  <p class="foot">연봉 순위: 국세청 2023년 귀속 만근 근로자 근로소득 · 자산 순위: 2025 가계금융복지조사 가구 순자산 기준. 일부 구간은 공개치 사이를 추정했어요.</p>`;
  countUp();
  $('cp').onclick=()=>{const ta=$('ct');const fb=()=>{ta.select();$('cpm').textContent='선택된 글을 길게 눌러 복사해 주세요'};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>$('cpm').textContent='복사했어요').catch(fb);else fb()};
  $('again').onclick=startCreate;$('home').onclick=renderIntro;
}

function countUp(){const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;document.querySelectorAll('[data-count]').forEach(el=>{const t=+el.dataset.count;if(reduce||t>=100)return;const fin=el.textContent;const st=performance.now(),dur=1100;const f=now=>{const k=Math.min(1,(now-st)/dur),e=1-Math.pow(1-k,3);const cur=100-(100-t)*e;el.textContent=fmtTop(cur);if(k<1)requestAnimationFrame(f);else el.textContent=fin};requestAnimationFrame(f)})}
// ===================== 부팅 =====================
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet'&&!$('sheetCard').querySelector('#ok,#go'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden&&!$('sheetCard').querySelector('#ok,#go'))closeSheet()});
function start(data){
  const s=(data&&data.S)||null;
  if(s&&s.v===5&&s.phase==='home'){S=s;renderHome()}else if(s&&s.v===5&&s.phase==='adult'){S=s;renderAdult()}else renderIntro();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
