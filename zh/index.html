<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>在韩国活下去</title>
<meta name="description" content="从八岁开学典礼到三十五岁银行卡余额。40种出路、150种职业。韩国人生模拟网页游戏。">
<meta property="og:type" content="website">
<meta property="og:title" content="在韩国活下去">
<meta property="og:description" content="从八岁开学典礼到三十五岁银行卡余额。我的年薪在韩国排前百分之几？">
<meta property="og:image" content="https://taehuicho00.github.io/korea-survival/og.png">
<meta property="og:url" content="https://taehuicho00.github.io/korea-survival/zh/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F2EFE6">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 레이아웃: 다이어리 한 권. 위는 그림 일기(장면+캐릭터), 아래는 플래너와 기록. 라이트는 종이, 다크는 밤의 책상. */
:root{
  --paper:#F2EFE6; --card:#FFFDF8; --ink:#1F2430; --muted:#646A74; --line:#DDD6C6;
  --accent:#3355A8; --accent-ink:#FFFFFF; --stamp:#D0432E; --good:#2F7A52; --warn:#B26B12;
  --soft:#ECE6D8; --chat:#FEE9A8; --chat-ink:#2A2414; --bubble:#FFFFFF;
  --shadow:0 1px 0 rgba(31,36,48,.05),0 10px 26px -14px rgba(31,36,48,.25);
  --f-display:"Noto Sans SC","PingFang SC","Microsoft YaHei","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-hand:"ZCOOL KuaiLe","Noto Sans SC","Apple SD Gothic Neo",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15171F; --card:#1E212C; --ink:#ECEAE4; --muted:#A3A7B2; --line:#323646;
  --accent:#93B0F5; --accent-ink:#121524; --stamp:#F38A73; --good:#86D3A6; --warn:#EDB66A;
  --soft:#272B38; --chat:#4A4120; --chat-ink:#FFF3C9; --bubble:#2B2F3D;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#15171F; --card:#1E212C; --ink:#ECEAE4; --muted:#A3A7B2; --line:#323646;
  --accent:#93B0F5; --accent-ink:#121524; --stamp:#F38A73; --good:#86D3A6; --warn:#EDB66A;
  --soft:#272B38; --chat:#4A4120; --chat-ink:#FFF3C9; --bubble:#2B2F3D;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:22px}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.label{font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--f-display);font-weight:800;line-height:1.15}
.hand{font-family:var(--f-hand)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.num{font-variant-numeric:tabular-nums}
.tiny{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:9px 12px;font-size:14px;width:auto}

/* 장면 */
.scene{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/10;max-width:100%;background:var(--soft)}
.scene svg{display:block;width:100%;height:100%}
.skins button{display:flex;align-items:center;justify-content:center;gap:6px}.skins i{width:14px;height:14px;border-radius:50%;background:var(--sk);border:1px solid rgba(0,0,0,.2)}
.regions{display:flex;flex-direction:column;gap:8px}.region{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 13px;width:100%}.region[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.region strong{font-size:16px}.region .pro{font-size:13.5px;color:var(--good);line-height:1.5}.region .con{font-size:13.5px;color:var(--stamp);line-height:1.5}
.scene::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:inherit;opacity:.35;background-image:radial-gradient(rgba(40,30,20,.13) .6px,transparent .7px),radial-gradient(rgba(255,255,255,.1) .6px,transparent .7px);background-size:3px 3px,4px 4px;background-position:0 0,1px 2px;mix-blend-mode:multiply}
.scene::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),inset 0 -30px 40px -30px rgba(0,0,0,.35);pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .scene svg,.ph svg{animation:scene-in .45s ease-out}
  @keyframes scene-in{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
  .av-bob{animation:av-bob 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes av-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  .av-blink{animation:av-blink 4.8s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes av-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .tw{animation:tw 1.9s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
  .rainy{animation:rainy .7s linear infinite}
  @keyframes rainy{from{transform:translate(4px,-12px)}to{transform:translate(0,0)}}
}
.thought{z-index:2;position:absolute;left:12px;top:14px;max-width:42%;background:var(--bubble);color:var(--ink);border-radius:14px;padding:7px 11px;font-family:var(--f-hand);font-size:18px;line-height:1.25;box-shadow:var(--shadow)}
.thought::after{content:"";position:absolute;right:-6px;bottom:8px;width:12px;height:12px;background:var(--bubble);transform:rotate(45deg);border-radius:2px}
.stamp-age{z-index:2;position:absolute;right:10px;top:10px;font-family:var(--f-display);font-size:13px;color:#fff;background:rgba(0,0,0,.45);border-radius:8px;padding:3px 8px}

/* 시작 */
.hero{display:grid;gap:14px}
.hero h1{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1.05}
.hero p{margin:0;max-width:36ch}

.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font:inherit;color:var(--ink);width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg.skins{grid-template-columns:1fr 1fr 1fr}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}

/* 능력치 */
.stats{display:flex;flex-direction:column;gap:7px}
.stat{display:grid;grid-template-columns:2.6em 1fr 4.2em;align-items:center;gap:10px;font-size:14px}
.stat>span{font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:4px}
.stat em{font-style:normal;text-align:right;font-weight:700}
.delta{color:var(--good);font-size:12px;font-weight:700}
.delta.neg{color:var(--stamp)}

/* 성향 */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.type{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px 10px;min-width:0}
.type[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.type .ava{width:100%;max-width:92px;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--soft)}
.type .ava svg{width:100%;height:100%;display:block}
.type strong{font-size:14.5px}
.type small{color:var(--muted);font-size:11.5px;line-height:1.3}

/* 홈 */
.headline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.ovr{font-family:var(--f-display);font-size:40px;line-height:1}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gauge{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.gauge b{display:block;height:100%;border-radius:4px;background:var(--good)}
.gauge.mid b{background:var(--warn)}
.gauge.hi b{background:var(--stamp)}
.planner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pslot{border:1.5px dashed var(--line);border-radius:12px;padding:10px 9px;min-height:84px;display:flex;flex-direction:column;gap:4px;background:var(--paper);text-align:left;min-width:0}
.pslot.on{border-style:solid;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.pslot span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.pslot strong{font-size:14px;line-height:1.25}
.pslot small{font-size:11.5px;color:var(--muted)}
.notice{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;width:100%}
.notice .badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--chat);color:var(--chat-ink)}
.notice.alert .badge{background:var(--stamp);color:#fff}
.notice strong{display:block;font-size:14.5px}
.notice small{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--paper);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;min-width:0}
.kv span{font-size:11.5px;color:var(--muted);font-weight:600}
.kv b{font-size:16px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;font-weight:600;background:var(--soft);border-radius:999px;padding:3px 9px}
.film{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.film div{flex:0 0 74px;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:11.5px;color:var(--muted)}
.film .ph{width:74px;height:74px;border-radius:10px;overflow:hidden;background:var(--soft)}
.film .ph svg{width:100%;height:100%;display:block}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--paper) 70%,transparent);z-index:5}
.dock .btn{max-width:520px;margin:0 auto;display:block;box-shadow:var(--shadow)}

/* 시트 */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet-card{background:var(--card);color:var(--ink);border-radius:18px;width:100%;max-width:520px;max-height:88%;overflow:auto;padding:20px 18px 18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
@media (min-width:700px){.sheet{align-items:center}}
@media (prefers-reduced-motion:no-preference){.sheet-card{animation:up .22s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:13px;width:100%}
.opt strong{font-size:15px}
.opt small{color:var(--muted);font-size:13px}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.fit{display:grid;grid-template-columns:1fr 3.5em;gap:8px;align-items:center;margin-top:4px}
.result{background:var(--paper);border-radius:12px;padding:12px;font-weight:600}
.fx{display:block;color:var(--accent);font-weight:700;font-size:13.5px;margin-top:4px}
.agrp{display:flex;flex-direction:column;gap:6px}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;width:100%}
.act i{width:10px;height:10px;border-radius:50%;grid-row:span 2}
.act strong{font-size:14.5px}
.act small{grid-column:2/-1;color:var(--muted);font-size:12.5px}
.act .cost{font-size:12.5px;font-weight:600}
.act[disabled]{opacity:.45;cursor:not-allowed}
.act[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}

/* 단톡방 */
.chatroom{background:color-mix(in srgb,var(--accent) 8%,var(--paper));border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px}
.chatroom .room{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.msg{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start}
.msg .who{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.msg .bub{display:flex;flex-direction:column;gap:2px;min-width:0}
.msg .bub span{font-size:11.5px;color:var(--muted)}
.msg .bub p{margin:0;background:var(--bubble);border-radius:4px 14px 14px 14px;padding:8px 11px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
.msg.me{grid-template-columns:1fr}
.msg.me p{margin:0 0 0 auto;background:var(--chat);color:var(--chat-ink);border-radius:14px 4px 14px 14px;padding:8px 11px;width:fit-content;max-width:85%}

.report{border-radius:12px;border:1px solid var(--line);padding:14px;position:relative;background:var(--card)}
.seal{position:absolute;right:12px;top:12px;border:2.5px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:2px 8px;font-family:var(--f-display);font-size:15px;transform:rotate(-6deg)}
.bigrank{font-family:var(--f-display);font-size:34px;line-height:1.05}
.runs{display:flex;flex-direction:column;gap:6px}
.run{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;border-radius:10px;background:var(--paper);font-size:13.5px}
.run b.great{color:var(--good)}
.run b.fail{color:var(--stamp)}
.awards{display:flex;flex-wrap:wrap;gap:6px}
.award{font-size:12.5px;font-weight:700;border:1.5px solid var(--stamp);color:var(--stamp);border-radius:6px;padding:2px 8px}
.comment{font-family:var(--f-hand);font-size:20px;line-height:1.4;margin:0}

.exam{display:flex;flex-direction:column;gap:8px}
.subj{display:grid;grid-template-columns:minmax(0,1fr) auto 4.6em;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.subj .g{font-family:var(--f-display);font-size:21px;text-align:right}
.subj.wait .g{color:var(--muted)}
.subj.pass .g{color:var(--good)}
.subj.fail .g{color:var(--stamp)}

/* 결산 */
.bigtitle{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.1}
.ranks{display:flex;flex-direction:column;gap:10px}
.rank{border-radius:16px;padding:16px;background:linear-gradient(160deg,#1E2238,#2B2F4F);color:#F3F1EA;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.rank.net{background:linear-gradient(160deg,#2A1E2E,#4A2B3E)}
.rank .label{color:#C9CCE0}
.rk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rk-tier{font-size:13px;font-weight:700;background:#F2C94C;color:#2A2414;border-radius:999px;padding:3px 10px;white-space:nowrap}
.rank.net .rk-tier{background:#F28AB8;color:#2A1420}
.rk-big{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rk-big b{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;color:#FFF}
.rk-big span{font-size:15px;font-weight:700;color:#E3E1F0}
.rk-line{margin:0;font-size:14.5px;line-height:1.55;color:#E3E1F0}
.rk-line strong{color:#FFE27A}
.rank.net .rk-line strong{color:#FFC2DD}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.dots i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.16)}
.dots i.a{background:rgba(255,255,255,.55)}
.dots i.me{background:#FFE27A;box-shadow:0 0 0 2px #FFF,0 0 10px 2px rgba(255,226,122,.8);transform:scale(1.35)}
.dots.net i.me{background:#FF9CCB;box-shadow:0 0 0 2px #FFF,0 0 10px 2px rgba(255,156,203,.8)}
@media (prefers-reduced-motion:no-preference){.dots i{animation:dot-in .3s both;animation-delay:var(--d)}@keyframes dot-in{from{opacity:0;transform:scale(.3)}}.dots i.me{animation:dot-me .5s 900ms both}@keyframes dot-me{from{opacity:0;transform:scale(3)}to{opacity:1;transform:scale(1.35)}}}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.money div{background:var(--paper);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.money span{font-size:11.5px;color:var(--muted);font-weight:600}
.money b{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15}
.money small{font-size:12px;color:var(--muted)}
.rankbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--paper)}
.rankbox .row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink)}
.rksec{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.rkres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.rkline{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rkline span{font-size:12px;color:var(--muted)}.rkline b{font-size:22px}.rkline small{font-size:11.5px;color:var(--muted)}
.rktabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.rktabs button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700}
.rktabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rklist{display:flex;flex-direction:column;gap:6px}

function apply(fx){
  const parts=[];
  for(const [k,v] of Object.entries(fx)){
    if(!v)continue;
    if(SN[k]){const b=S.st[k];S.st[k]=clamp(S.st[k]+v,1,99);const d=S.st[k]-b;if(d)parts.push(`${SN[k]} ${sg(d)}`)}
    else if(k==='study'){S.study=clamp(S.study+v,0,100);parts.push(`学业 ${sg(v)}`)}
    else if(k==='stress'){S.stress=clamp(S.stress+v,0,100);parts.push(`压力 ${sg(v)}`)}
    else if(k==='money'){S.money+=v;parts.push(`预算 ${v>0?'+':''}${man(v)}`)}
    else if(k.startsWith('tag:')){const t=k.slice(4);S.tags[t]=(S.tags[t]||0)+v;parts.push(`${TAGN[t]}经验 ${sg(v)}`)}
  }
  return parts.join(' · ');
}

function pathNeeded(){if(S.t===2&&!S.mid)return 'mid';if(S.t===5&&!S.high)return 'high';if(S.t===6&&!S.route)return 'route';return null}
function avgTop(ts){const h=S.hist.filter(x=>ts.includes(x.t));return h.length?h.reduce((s,x)=>s+x.top,0)/h.length:50}
function goalFit(id){
  const g=GOALS[id];let f=0;for(const [k,w] of Object.entries(g.w))f+=S.st[k]*w;
  f+=Math.min(tag(g.tag),10)*1.5;
  const b=S.high&&HIGH[S.high].bonus;
  if(b&&(b.includes(id)||(b.includes('arts')&&g.route==='arts')))f+=5;
  if(id==='farm'&&REG().rural)f+=5;
  if(id==='startup')f+=clamp(S.money/100,0,6)+(S.flags.appKid?10:0);
  if(id==='idol')f+=(S.flags.scout?8:0)+(S.flags.tvKid?6:0)+(S.flags.festStar?3:0);
  if(id==='youtuber')f+=(S.flags.viralKid?6:0)+(S.flags.tvKid?3:0);
  if(id==='gamer'&&S.flags.ban)f-=12;
  if(id==='musicm'||id==='actm')f+=S.flags.tvKid?4:0;
  return f;
}
const roundP=(f,r)=>sig((f-(75+r*5))/9);
const goalChance=id=>{const f=goalFit(id);return [0,1,2].reduce((p,r)=>p*roundP(f,r),1)};

    return {title:"升高中",desc:`初中校内成绩平均排在前${top.toFixed(0)}%。`,opts:[

  return {title:route==='dream'?"挑战哪个梦想？":route==='job'?"去哪儿工作？":"选什么专业？",desc:"这是根据当前属性和经验算出的成功率。剩下两年的日程可以把它刷上去。",

function dexBlock(name,order,got,nm,ds){
  const have=order.filter(id=>got.includes(id)).length,pct=Math.round(have/Math.max(1,order.length)*100);
  const isJob=order===JOB_ORDER,cat=id=>isJob?JOBMAP[id][2]:'';
  const cats=isJob?[...new Set(order.map(cat))]:[];
  const chip=(f,l,n)=>`<button type="button" class="dxc${f==='all'?' on':''}" data-f="${esc(f)}">${esc(l)}<em>${n}</em></button>`;
  const chips=[chip('all',"全部",order.length),chip('got',"已解锁",have),chip('lock',"未解锁",order.length-have)].concat(cats.map(c=>chip('c:'+c,c,order.filter(id=>cat(id)===c).length))).join('');
  const tiles=order.map(id=>{const g=got.includes(id);return `<button type="button" class="dxt ${g?'got':'lock'}" data-c="${esc(cat(id))}" data-n="${esc(g?nm(id):'???')}" data-d="${esc(g?(ds?ds(id):''):"还没遇到过")}">${esc(g?nm(id):'???')}</button>`}).join('');
  return `<details class="card col dexbox"><summary class="between" style="cursor:pointer;list-style:none"><span class="label">${esc(name)}</span><span class="tiny num">${have} / ${order.length} · ${pct}%</span></summary>
    <div class="dxbar"><i style="width:${pct}%"></i></div><div class="dxf">${chips}</div><div class="dxg">${tiles}</div><div class="dxd">${esc("点格子查看说明")}</div></details>`;
}

const CONDS=[["状态拉满，下笔如有神。",.25,-1,0],["正常发挥，稳稳的。",0,-1,0],["第一节语文时间不够用了。",0,0,-.7],

function calcSuneung(){
  const sch=S.high?HIGH[S.high]:{};

  const base=.45*S.st.int+.55*S.study;

    const z=(base-54)/22+SUN_BONUS+(REG().sunZ||0)+(S.st.mnt-50)/60+(S.st.phy-50)/150+(S.st.luck-50)/120-(S.stress>60?(S.stress-60)/80:0)+c[1]+(c[2]===i?c[3]:0)+(sch.sun||0)+randn()*.5;

  const naesin=Math.max(1,gradeOf(avgTop([5,6,7]))-(S.high==='elite'||S.high==='science'?.8:0));

function jobOutfit(){

function rankBoxHTML(){if(!RANK_URL)return '';return `<div class="rankbox"><div class="label">挑战总排行榜</div><p class="tiny" style="margin:0">昵称和结果（职业 · 称号 · 四格）会公开在排行榜上。</p>

  <button class="btn" id="rkb">返回排行榜</button>`);

function countUp(){const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;document.querySelectorAll('[data-count]').forEach(el=>{const t=+el.dataset.count;if(reduce||t>=100)return;const fin=el.textContent;const st=performance.now(),dur=1100;const f=now=>{const k=Math.min(1,(now-st)/dur),e=1-Math.pow(1-k,3);const cur=100-(100-t)*e;el.textContent=fmtTop(cur);if(k<1)requestAnimationFrame(f);else el.textContent=fin};requestAnimationFrame(f)})}
// ----- 결과 카드 이미지 (1080×1350) -----
function shareCardSVG(o){
  const W=1080,H=1350,F='PingFang SC,Microsoft YaHei,Noto Sans SC,Noto Sans CJK SC,sans-serif';
  const ex=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nest=(svg,x,y,w,h)=>svg.replace(/^<svg /,`<svg x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" `).replace(/class="[^"]*"/g,'');
  const cuts=o.cuts.map((c,i)=>{const x=84+(i%2)*462,y=300+Math.floor(i/2)*400;return `<rect x="${x-6}" y="${y-6}" width="${450}" height="${370}" rx="26" fill="#2A2A30"/><clipPath id="cc${i}"><rect x="${x}" y="${y}" width="438" height="320" rx="18"/></clipPath><g clip-path="url(#cc${i})">${nest(c.svg,x,y,438,320)}</g><text x="${x+219}" y="${y+352}" text-anchor="middle" font-family="${F}" font-size="26" font-weight="700" fill="#E8E8EA">${ex(c.cap)}</text>`}).join('');
  const box=(x,y,w,label,val,sub,col)=>`<rect x="${x}" y="${y}" width="${w}" height="150" rx="24" fill="${col}"/><text x="${x+28}" y="${y+44}" font-family="${F}" font-size="24" font-weight="700" fill="#FFFFFFB0">${ex(label)}</text><text x="${x+28}" y="${y+100}" font-family="${F}" font-size="50" font-weight="800" fill="#FFF">${ex(val)}</text><text x="${x+28}" y="${y+134}" font-family="${F}" font-size="24" fill="#FFFFFFD0">${ex(sub)}</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <rect width="${W}" height="${H}" fill="#F2EFE6"/><rect x="40" y="40" width="${W-80}" height="${H-80}" rx="44" fill="#FFFDF8" stroke="#DDD6C6" stroke-width="3"/>
  <text x="84" y="128" font-family="${F}" font-size="30" font-weight="700" fill="#646A74">在韩国活下去 · 35岁成绩单</text>
  <text x="84" y="206" font-family="${F}" font-size="64" font-weight="900" fill="#1F2430">${ex(o.title)}</text>
  <text x="84" y="258" font-family="${F}" font-size="30" fill="#3B4150">${ex(o.name)} · ${ex(o.job)}</text>
  <g transform="rotate(-6 ${W-170} 160)"><rect x="${W-300}" y="118" width="230" height="78" rx="14" fill="none" stroke="#D0432E" stroke-width="5"/><text x="${W-185}" y="171" text-anchor="middle" font-family="${F}" font-size="34" font-weight="900" fill="#D0432E">${ex(o.region)}</text></g>
  ${cuts}
  ${box(84,1100,450,"年薪 · 韩国打工人",o.salTop,o.sal,'#2B2F4F')}${box(546,1100,450,"净资产 · 韩国家庭",o.netTop,o.net,'#4A2B3E')}
  <text x="${W/2}" y="1300" text-anchor="middle" font-family="${F}" font-size="26" fill="#646A74">taehuicho00.github.io/korea-survival/zh · 我是前百分之几的人生？</text></svg>`;
}
function fixCard(svg,o){const wu=s=>[...String(s)].reduce((a,c)=>a+(/[\u1100-\uffff]/.test(c)?1:.56),0),fit=(s,max,px)=>Math.max(18,Math.min(max,Math.floor(px/Math.max(1,wu(s)))));
  return svg.replace('font-size="64" font-weight="900" fill="#1F2430">',`font-size="${fit(o.title,64,650)}" font-weight="900" fill="#1F2430">`).replace('font-size="34" font-weight="900" fill="#D0432E">',`font-size="${fit(o.region,34,200)}" font-weight="900" fill="#D0432E">`)}
function saveShareCard(o,btn,msg){
  const svg=fixCard(shareCardSVG(o),o);const img=new Image();btn.disabled=true;msg.textContent="图片生成中…";
  img.onload=()=>{try{const c=document.createElement('canvas');c.width=1080;c.height=1350;const g=c.getContext('2d');g.drawImage(img,0,0);
    c.toBlob(async b=>{btn.disabled=false;if(!b){msg.textContent="图片生成失败";return}
      const file=new File([b],"在韩国活下去-结果.png",{type:'image/png'});
      try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"在韩国活下去",text:"我的35岁成绩单"});msg.textContent="已分享";return}}catch(e){if(e&&e.name==='AbortError'){msg.textContent='';return}}
      const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg.textContent="图片已保存";
      const pv=$('cardpv');if(pv){pv.hidden=false;pv.src=c.toDataURL('image/png')}},'image/png')}catch(e){btn.disabled=false;msg.textContent="该浏览器不支持保存图片"}};
  img.onerror=()=>{btn.disabled=false;msg.textContent="图片生成失败"};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
